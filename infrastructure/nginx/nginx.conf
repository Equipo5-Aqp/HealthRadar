# CORREGIDO: upstreams en :3000 (PORT interno del Dockerfile).
# Los puertos 3001/3002 son SOLO para scripts "dev" locales (next dev).
upstream mf_consulta   { server mf-consulta:3000; }
upstream mf_historicos { server mf-historicos:3000; }

server {
  listen 3000;

  # MF-2: /historicos (incluye /historicos/api/historicos y /historicos/_next/*)
  location /historicos {
    proxy_pass         http://mf_historicos;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # MF-1: todo lo demás → consulta NLQ
  location / {
    proxy_pass         http://mf_consulta;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
}
