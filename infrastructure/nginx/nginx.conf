# Upstreams en :3000 (PORT interno del Dockerfile).
# Los puertos 3001/3002/3003 son SOLO para scripts "dev" locales (next dev).
upstream mf_dashboard  { server mf-dashboard:3000;  }
upstream mf_consulta   { server mf-consulta:3000;   }
upstream mf_historicos { server mf-historicos:3000;  }

server {
  listen 3000;

  # MF-3: /historicos (incluye /historicos/mapa, /historicos/api/*, /historicos/_next/*)
  location /historicos {
    proxy_pass         http://mf_historicos;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # MF-2: /consulta (incluye /consulta/api/*, /consulta/_next/*)
  location /consulta {
    proxy_pass         http://mf_consulta;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # MF-1: / → Dashboard Panorama (catch-all; nginx evalúa de mayor a menor especificidad)
  location / {
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
}
