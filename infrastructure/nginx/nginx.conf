# ADR-013: Upstreams en :3000 (PORT interno del Dockerfile).
# Los puertos 3001/3002/3003 son SOLO para scripts "dev" locales (next dev).
# ADR-014: auth_request global protege todo el sitio; las rutas publicas lo desactivan.
upstream mf_dashboard  { server mf-dashboard:3000;  }
upstream mf_consulta   { server mf-consulta:3000;   }
upstream mf_historicos { server mf-historicos:3000;  }

# (OPCIONAL) Cache de 10 s de la validacion de sesion, para no llamar a n8n en cada peticion.
# Para activarla: descomentar esta linea Y las 4 lineas "proxy_cache*" / "proxy_ignore_headers" de /_auth.
# Probada (nginx 1.24): 5 peticiones seguidas = 1 sola llamada a /api/auth/sesion.
# Costo: un logout o una sesion revocada puede tardar hasta 10 s en notarse.
# proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=auth_sesion:1m max_size=1m inactive=1m;

server {
  listen 3000;

  # ── Proteccion por sesion (HU-6, ADR-014: nginx auth_request) ───────────────
  # Toda peticion pregunta primero a /_auth. Las rutas publicas lo desactivan con
  # "auth_request off;" (mas abajo): /login, /api/auth/*, estaticos y /healthz.
  auth_request /_auth;
  error_page 401 = @sin_sesion;

  # Pregunta a mf-dashboard: GET /api/auth/sesion con la cookie hr_sesion.
  #   200 = sesion valida → deja pasar · 401 = sin sesion → @sin_sesion
  location = /_auth {
    internal;
    auth_request off;
    proxy_pass              http://mf_dashboard/api/auth/sesion;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        Host $host;
    proxy_connect_timeout   3s;
    proxy_read_timeout      10s;
    # proxy_cache             auth_sesion;
    # proxy_cache_key         $cookie_hr_sesion;
    # proxy_cache_valid       200 401 10s;
    # proxy_ignore_headers    Cache-Control Set-Cookie;
  }

  # Sin sesion: las APIs reciben 401 JSON; las paginas van al login (que vuelve a donde ibas).
  # SEGURIDAD: usar $request_uri (no $uri) para evitar inyeccion de cabeceras con %0d%0a.
  location @sin_sesion {
    default_type application/json;
    if ($uri ~ "/api/") {
      return 401 '{"error":true,"codigo":"SIN_SESION","mensaje":"Inicia sesion para continuar"}';
    }
    return 302 /login?next=$request_uri;
  }

  # ── Rutas PUBLICAS (no piden sesion) ────────────────────────────────────────

  # Salud de nginx (para el healthcheck de docker-compose, ADR-014).
  # Necesario porque / ahora redirige a /login cuando no hay sesion.
  location = /healthz {
    auth_request off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Pagina de login y API de autenticacion (viven en mf-dashboard).
  location /login {
    auth_request off;
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
  location /api/auth/ {
    auth_request off;
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # Archivos estaticos de Next (JS/CSS). Sin ellos la propia pagina de login no carga.
  location /_next/static/ {
    auth_request off;
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
  }
  location /consulta/_next/static/ {
    auth_request off;
    proxy_pass         http://mf_consulta;
    proxy_set_header   Host              $host;
  }
  location /historicos/_next/static/ {
    auth_request off;
    proxy_pass         http://mf_historicos;
    proxy_set_header   Host              $host;
  }
  location = /favicon.ico {
    auth_request off;
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
  }

  # ── Rutas PROTEGIDAS (igual que antes; ahora exigen sesion via auth_request global) ──

  # MF-3: /historicos (incluye /historicos/mapa, /historicos/api/*, /historicos/data/*)
  location /historicos {
    proxy_pass         http://mf_historicos;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # MF-2: /consulta (incluye /consulta/api/*)
  location /consulta {
    proxy_pass         http://mf_consulta;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # MF-1: / → Dashboard Panorama (catch-all)
  location / {
    proxy_pass         http://mf_dashboard;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
}
