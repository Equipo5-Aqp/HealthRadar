# ADR-008: Docker Compose como estrategia de despliegue self-hosted
# Todos los servicios en la red interna healthradar-net.
# Únicamente nginx-shell expone puerto público al host (3000).
# RAM total: postgres 768 + n8n 1536 + phoenix 512 + nginx 64 + mf-consulta 192 + mf-historicos 192 = 3264 MB / 4096 MB (ADR-011, ADR-012)

networks:
  healthradar-net:
    driver: bridge
    # IP fija: evita que Docker reasigne IPs al reiniciar la VM.
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  phoenix_data:
    driver: local

services:
  # Base de datos única: PostgreSQL 16 con extensión pgvector (ADR-002)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthradar-postgres
    restart: unless-stopped
    environment:
      # Sin valores por defecto: las credenciales SIEMPRE vienen de infrastructure/.env
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en infrastructure/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB en infrastructure/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/database/migrations:/docker-entrypoint-initdb.d
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.4
    # Apagado limpio: da 30s a Postgres para flush de WAL y cierre ordenado
    stop_grace_period: 30s
    # Aislamiento según ADR-008: Puerto expuesto deshabilitado por defecto hacia el host público.
    # Descomentar la siguiente línea únicamente para depuración local con DBeaver/psql:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Definir POSTGRES_USER en infrastructure/.env} -d ${POSTGRES_DB:?Definir POSTGRES_DB en infrastructure/.env}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # HU-203: Límite de RAM — pgvector puede crecer con consultas vectoriales complejas
    mem_limit: 768m
    memswap_limit: 768m
    # HU-203: Rotación de logs — máx 10 MB × 3 archivos = 30 MB en disco
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Orquestador: n8n Self-Hosted (ADR-001) + @healthradar/core embebido (ADR-012)
  n8n:
    build:
      context: ..
      dockerfile: infrastructure/n8n/Dockerfile
    container_name: healthradar-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-n8n}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Definir N8N_ENCRYPTION_KEY en infrastructure/.env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:?Definir POSTGRES_DB en infrastructure/.env}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:?Definir POSTGRES_USER en infrastructure/.env}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en infrastructure/.env}
      # Proveedores de Modelos de Lenguaje (ADR-003, ADR-010)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_KEY_KIMI=${NVIDIA_API_KEY_KIMI:-}
      # Habilitar acceso a variables de entorno dentro de los nodos de n8n ($env)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # System Prompts inyectados desde el entorno (consumidos vía $env en nodos de n8n)
      - SYSTEM_PROMPT_CONEXION=${SYSTEM_PROMPT_CONEXION:-}
      - SYSTEM_PROMPT_FASE_B=${SYSTEM_PROMPT_FASE_B:-}
      # ADR-012: Habilitar require('@healthradar/core') desde nodos Code de n8n
      - NODE_FUNCTION_ALLOW_EXTERNAL=@healthradar/core
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.3
    # Apagado limpio: da 15s a n8n para cerrar workflows activos
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    # Aislamiento según ADR-008: Puerto 5678 no expuesto al host público.
    # Descomentar únicamente para acceder a la UI de n8n en desarrollo local:
    # ports:
    #   - "5678:5678"
    # HU-203: Healthcheck — endpoint de salud interno de n8n
    # start_period 120s: en arranque en frío de la VM, n8n tarda ~60s en recuperar
    # la conexión a PostgreSQL (observado en logs: "recovered after 2 attempts in 57749ms")
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # ADR-012: Límite de RAM — Node.js + workflows + @healthradar/core embebido
    mem_limit: 1536m
    memswap_limit: 1536m
    # HU-203: Rotación de logs — máx 10 MB × 3 archivos = 30 MB en disco
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Observabilidad LLM: Arize Phoenix Self-Hosted (ADR-010)
  # Reemplaza Langfuse v2 (EOL Q1-2025). Phoenix = 1 solo contenedor + Postgres existente.
  phoenix:
    image: arizephoenix/phoenix:20.3.0
    container_name: healthradar-phoenix
    restart: unless-stopped
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER:?Definir POSTGRES_USER en infrastructure/.env}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en infrastructure/.env}@postgres:5432/${POSTGRES_DB:?Definir POSTGRES_DB en infrastructure/.env}
      - PHOENIX_ENABLE_AUTH=${PHOENIX_ENABLE_AUTH:-false}
      - PHOENIX_SECRET=${PHOENIX_SECRET:?Definir PHOENIX_SECRET en infrastructure/.env}
      - PHOENIX_WORKING_DIR=/phoenix-data
    volumes:
      - phoenix_data:/phoenix-data
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.5
    depends_on:
      postgres:
        condition: service_healthy
    # Aislamiento según ADR-008: Puertos no expuestos al host por defecto.
    # La imagen declara 4317 (OTLP gRPC), 6006 (UI) y 9090 (métricas); es comportamiento esperado.
    # ports:
    #   - "6006:6006"
    # HU-203: Healthcheck — la imagen no incluye wget/curl; se verifica la UI (6006) con python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:6006/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # HU-203: Límite de RAM — observabilidad no crítica, puede ser apretado
    mem_limit: 512m
    memswap_limit: 512m
    # HU-203: Rotación de logs — máx 10 MB × 3 archivos = 30 MB en disco
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Shell Router: nginx reenvía /historicos → mf-historicos y / → mf-consulta
  nginx-shell:
    image: nginx:1.27-alpine
    container_name: healthradar-nginx-shell
    restart: unless-stopped
    # CUMPLIMIENTO ADR-008: único servicio que expone puerto público (3000:3000)
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mf-consulta:
        condition: service_healthy
      mf-historicos:
        condition: service_healthy
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.2     # misma IP que tenía frontend
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Microfrontend 1: Chat NLQ (Next.js standalone, basePath vacío)
  mf-consulta:
    build:
      context: ../src/mf-consulta
      dockerfile: Dockerfile
    container_name: healthradar-mf-consulta
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - N8N_INTERNAL_URL=http://n8n:5678
      # NEXT_PUBLIC_BASEPATH no se define → el adapter usa BASE='' → /api/... directo
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.6
    depends_on:
      n8n:
        condition: service_healthy
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Microfrontend 2: Datos históricos (basePath '/historicos')
  mf-historicos:
    build:
      context: ../src/mf-historicos
      dockerfile: Dockerfile
    container_name: healthradar-mf-historicos
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - N8N_INTERNAL_URL=http://n8n:5678
      # NEXT_PUBLIC_* NO se lee en runtime (se inlinea en build).
      # El fix de basePath vive en n8nHistoricosAdapter.js como constante '/historicos'.
    networks:
      healthradar-net:
        ipv4_address: 172.20.0.7
    depends_on:
      n8n:
        condition: service_healthy
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/historicos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s 
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
