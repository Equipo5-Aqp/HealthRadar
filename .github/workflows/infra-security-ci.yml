name: Infra Security CI

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-docker-ports:
    name: Verificar exposición de puertos y variables (ADR-008 / ADR-013 / ADR-014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios relevantes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - '.github/workflows/infra-security-ci.yml'

      - name: Verificar que solo nginx-shell expone puerto público
        if: steps.filter.outputs.infra == 'true'
        run: |
          python3 - <<'PYEOF'
          import re, sys

          COMPOSE_FILE = "infrastructure/docker-compose.yml"
          PUBLICO = "nginx-shell"  # ADR-013/ADR-014: único punto de entrada (3000)

          # Servicios = claves con 2 espacios bajo "services:"; se ignoran líneas comentadas.
          servicios, actual, en_services = {}, None, False
          with open(COMPOSE_FILE, encoding="utf-8") as fh:
              for linea in fh:
                  if not linea.strip() or linea.lstrip().startswith("#"):
                      continue
                  if re.match(r"^\S", linea):
                      en_services = linea.startswith("services:")
                      actual = None
                      continue
                  if not en_services:
                      continue
                  m = re.match(r"^  ([A-Za-z0-9_.-]+):", linea)
                  if m:
                      actual = m.group(1)
                      servicios[actual] = False
                  elif actual and re.match(r"^    ports:", linea):
                      servicios[actual] = True

          if PUBLICO not in servicios:
              print(f"❌ No se encontró el servicio '{PUBLICO}' en {COMPOSE_FILE}")
              sys.exit(1)

          FAIL = 0
          for nombre, expone in servicios.items():
              if nombre == PUBLICO:
                  print(f"{'✅' if expone else '❌'} '{nombre}' {'expone' if expone else 'NO expone'} el puerto público")
                  FAIL |= not expone
              elif expone:
                  print(f"❌ '{nombre}' expone puertos al host (viola ADR-008: solo '{PUBLICO}' es público)")
                  FAIL = 1
              else:
                  print(f"✅ '{nombre}' no expone puertos al host")
          sys.exit(FAIL)
          PYEOF

      - name: Verificar que cada variable del compose está en .env.example
        if: steps.filter.outputs.infra == 'true'
        run: |
          COMPOSE_FILE="infrastructure/docker-compose.yml"
          TEMPLATE="infrastructure/.env.example"
          FAIL=0
          for VAR in $(grep -oE '\$\{[A-Z0-9_]+' "$COMPOSE_FILE" | sed 's/^\${//' | sort -u); do
            if grep -qE "^${VAR}=" "$TEMPLATE"; then
              echo "✅ $VAR"
            else
              echo "❌ $VAR se usa en $COMPOSE_FILE pero no está documentada en $TEMPLATE"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Sin cambios relevantes
        if: steps.filter.outputs.infra == 'false'
        run: echo "✅ Este PR no toca infrastructure/ — se omite la validación, check en verde"

  verify-backup-script:
    name: Validar script de backups HU-303 (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Analizar backup_healthradar.sh
        run: |
          SCRIPT="infrastructure/scripts-poc-arquitectura/backup_healthradar.sh"
          test -f "$SCRIPT" || { echo "❌ No existe $SCRIPT"; exit 1; }
          test -x "$SCRIPT" || { echo "❌ $SCRIPT no tiene bit ejecutable"; exit 1; }
          bash -n "$SCRIPT" && echo "✅ Sintaxis bash OK"
          shellcheck -S warning "$SCRIPT"

      - name: Sin secretos ni puertos en el script
        run: |
          SCRIPT="infrastructure/scripts-poc-arquitectura/backup_healthradar.sh"
          ! grep -nE "POSTGRES_PASSWORD=|N8N_ENCRYPTION_KEY=|GEMINI_API_KEY=|ports:" "$SCRIPT" \
            && echo "✅ Sin credenciales hardcodeadas ni ports: en el script" \
            || { echo "❌ El script contiene secretos o ports:"; exit 1; }