name: Infra Security CI

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-docker-ports:
    name: Verificar exposición de puertos y variables (ADR-008 / ADR-013 / ADR-014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios relevantes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - '.github/workflows/infra-security-ci.yml'

      - name: Verificar que solo nginx-shell expone puerto público
        if: steps.filter.outputs.infra == 'true'
        run: |
          python3 - <<'PYEOF'
          import re, sys

          COMPOSE_FILE = "infrastructure/docker-compose.yml"
          PUBLICO = "nginx-shell"  # ADR-013/ADR-014: único punto de entrada (3000)

          # Servicios = claves con 2 espacios bajo "services:"; se ignoran líneas comentadas.
          servicios, actual, en_services = {}, None, False
          with open(COMPOSE_FILE, encoding="utf-8") as fh:
              for linea in fh:
                  if not linea.strip() or linea.lstrip().startswith("#"):
                      continue
                  if re.match(r"^\S", linea):
                      en_services = linea.startswith("services:")
                      actual = None
                      continue
                  if not en_services:
                      continue
                  m = re.match(r"^  ([A-Za-z0-9_.-]+):", linea)
                  if m:
                      actual = m.group(1)
                      servicios[actual] = False
                  elif actual and re.match(r"^    ports:", linea):
                      servicios[actual] = True

          if PUBLICO not in servicios:
              print(f"❌ No se encontró el servicio '{PUBLICO}' en {COMPOSE_FILE}")
              sys.exit(1)

          FAIL = 0
          for nombre, expone in servicios.items():
              if nombre == PUBLICO:
                  print(f"{'✅' if expone else '❌'} '{nombre}' {'expone' if expone else 'NO expone'} el puerto público")
                  FAIL |= not expone
              elif expone:
                  print(f"❌ '{nombre}' expone puertos al host (viola ADR-008: solo '{PUBLICO}' es público)")
                  FAIL = 1
              else:
                  print(f"✅ '{nombre}' no expone puertos al host")
          sys.exit(FAIL)
          PYEOF

      - name: Verificar que cada variable del compose está en .env.example
        if: steps.filter.outputs.infra == 'true'
        run: |
          COMPOSE_FILE="infrastructure/docker-compose.yml"
          TEMPLATE="infrastructure/.env.example"
          FAIL=0
          for VAR in $(grep -oE '\$\{[A-Z0-9_]+' "$COMPOSE_FILE" | sed 's/^\${//' | sort -u); do
            if grep -qE "^${VAR}=" "$TEMPLATE"; then
              echo "✅ $VAR"
            else
              echo "❌ $VAR se usa en $COMPOSE_FILE pero no está documentada en $TEMPLATE"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Sin cambios relevantes
        if: steps.filter.outputs.infra == 'false'
        run: echo "✅ Este PR no toca infrastructure/ — se omite la validación, check en verde"

  verify-backup-script:
    name: Validar scripts de backup y recuperación HU-303 / ADR-015 (shellcheck)
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: infrastructure/scripts-poc-arquitectura
      # Ejecutables (cron/cloud-init) + helper que se carga con source (sin bit ejecutable)
      EJECUTABLES: backup_healthradar.sh tf_bootstrap_vm.sh tf_restore_healthradar.sh tf_preparar_host.sh
      HELPERS: tf_azure_blob.sh
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Analizar scripts
        run: |
          cd "$SCRIPTS_DIR"
          for SCRIPT in $EJECUTABLES $HELPERS; do
            test -f "$SCRIPT" || { echo "❌ No existe $SCRIPT"; exit 1; }
            bash -n "$SCRIPT" && echo "✅ Sintaxis bash OK: $SCRIPT"
          done
          for SCRIPT in $EJECUTABLES; do
            test -x "$SCRIPT" || { echo "❌ $SCRIPT no tiene bit ejecutable"; exit 1; }
          done
          # -x sigue los `source` de tf_azure_blob.sh (ruta relativa a este directorio)
          shellcheck -x -S warning $EJECUTABLES $HELPERS

      - name: Sin secretos ni puertos en los scripts
        run: |
          cd "$SCRIPTS_DIR"
          ! grep -nE "POSTGRES_PASSWORD=|N8N_ENCRYPTION_KEY=|GEMINI_API_KEY=|AccountKey=|sig=|ports:" $EJECUTABLES $HELPERS \
            && echo "✅ Sin credenciales hardcodeadas ni ports: en los scripts" \
            || { echo "❌ Algún script contiene secretos o ports:"; exit 1; }

  verify-terraform:
    name: Validar Terraform de recuperación (ADR-015)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Validar (sin backend ni credenciales de Azure)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Sin estado ni variables reales versionadas
        run: |
          ! git ls-files . | grep -E '\.tfstate|(^|/)terraform\.tfvars$' \
            && echo "✅ Sin tfstate ni terraform.tfvars en git" \
            || { echo "❌ Hay estado o variables reales de Terraform versionadas"; exit 1; }