name: n8n Validate CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar JSONs de n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios relevantes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            n8n:
              - 'src/n8n-workflows/**'
              - 'src/ia-ops/**'

      - name: Configurar Python
        if: steps.filter.outputs.n8n == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar estructura JSON de los workflows
        if: steps.filter.outputs.n8n == 'true'
        run: |
          echo "Validando JSON de workflows n8n..."
          find src/n8n-workflows/production src/n8n-workflows/templates -name "*.json" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || (echo "❌ JSON inválido: $f" && exit 1)
            echo "✅ $f válido"
          done

      - name: Detectar credenciales expuestas
        if: steps.filter.outputs.n8n == 'true'
        run: |
          echo "Buscando posibles secretos en los workflows..."
          if grep -riE "api[_-]?key|password|secret|token|bearer" src/n8n-workflows --include="*.json"; then
            echo "❌ Se detectaron posibles credenciales expuestas en los workflows"
            exit 1
          fi
          echo "✅ Sin credenciales expuestas"

      - name: Sin cambios relevantes
        if: steps.filter.outputs.n8n == 'false'
        run: echo "✅ Este PR no toca n8n-workflows/ ni ia-ops/ — se omite la validación, check en verde"

  validate-live-connection:
    name: Validación contra instancia n8n (opcional - no bloqueante)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    steps:
      - name: Verificar si hay credenciales de n8n configuradas
        id: check_n8n
        run: |
          if [ -z "${{ secrets.N8N_API_URL }}" ] || [ -z "${{ secrets.N8N_WEBHOOK_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Secrets N8N_API_URL / N8N_WEBHOOK_KEY no configurados — se omite la validación en vivo"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Probar conexión con la instancia n8n (informativo)
        if: steps.check_n8n.outputs.skip == 'false'
        env:
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_WEBHOOK_KEY: ${{ secrets.N8N_WEBHOOK_KEY }}
        run: |
          echo "ℹ️ Intentando conexión con la instancia n8n..."
          if curl -sf --max-time 10 -X POST -H "X-N8N-Webhook-Key: $N8N_WEBHOOK_KEY" "$N8N_API_URL/webhook/657f267f-0288-451d-93f4-68a0ac1dd254" > /dev/null; then
            echo "✅ Conexión exitosa con n8n"
          else
            echo "⚠️ No se pudo conectar a la instancia n8n (esperado: es una instancia local, no accesible desde GitHub Actions)."
            echo "   Validación omitida. Este check es informativo y no bloquea el merge."
          fi