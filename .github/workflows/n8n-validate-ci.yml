name: n8n Validate CI

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validar JSONs de n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios relevantes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            n8n:
              - 'src/n8n-workflows/**'
              - 'src/ia-ops/**'
              - '.github/workflows/n8n-validate-ci.yml'

      - name: Verificar version fijada de n8n
        run: |
          PIN=$(grep -oE 'n8nio/n8n:[0-9]+\.[0-9]+\.[0-9]+' infrastructure/n8n/Dockerfile | head -n1 | cut -d: -f2)
          if [ -z "$PIN" ]; then
            echo "ERROR: infrastructure/n8n/Dockerfile no fija una version exacta de n8n"
            exit 1
          fi
          if ! grep -qF "| n8n |" README.md || ! grep -qF "$PIN" README.md; then
            echo "ERROR: README.md no declara n8n $PIN"
            exit 1
          fi
          if grep -RqsE 'n8nio/n8n:(latest|stable|develop)' infrastructure .github --include='*.yml' --include='*.yaml' --include='Dockerfile*'; then
            echo "ERROR: hay referencias a tags moviles de n8n"
            exit 1
          fi
          echo "OK: n8n $PIN fijado y documentado"

      - name: Configurar Python
        if: steps.filter.outputs.n8n == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar estructura JSON de los workflows
        if: steps.filter.outputs.n8n == 'true'
        run: |
          echo "Validando JSON de workflows n8n..."
          find src/n8n-workflows -name "*.json" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || (echo "❌ JSON inválido: $f" && exit 1)
            echo "✅ $f válido"
          done

      - name: Detectar credenciales expuestas
        if: steps.filter.outputs.n8n == 'true'
        run: |
          echo "Buscando posibles secretos en los workflows..."
          python3 - <<'PYEOF'
          import json, re, sys, glob

          # Claves que representan credenciales reales si traen un valor no vacío.
          SECRET_KEY = re.compile(
              r"(?i)(api[_-]?key|apikey|passwd|password|client[_-]?secret|"
              r"access[_-]?token|auth[_-]?token|refresh[_-]?token|bearer|authorization)"
          )
          # Patrones de secretos reales por formato (API keys, JWT, llaves privadas).
          # nvapi-: NVIDIA (Kimi/GLM vía nodos HTTP). Bearer literal: token pegado en una cabecera.
          SECRET_VALUE = re.compile(
              r"(?i)(sk-[a-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,}|ghp_[a-z0-9]{20,}|"
              r"nvapi-[a-z0-9_-]{20,}|bearer\s+[a-z0-9._~+/-]{20,}|"
              r"xox[baprs]-[a-z0-9-]{10,}|-----BEGIN [A-Z ]+PRIVATE KEY-----|"
              r"eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{5,}\.[a-zA-Z0-9_-]{5,})"
          )
          # Metadato interno de n8n: solo referencias id/name, nunca secretos.
          IGNORED_KEYS = {"credentials"}

          def walk(obj, path, hits):
              if isinstance(obj, dict):
                  # Cabeceras/parámetros de nodos HTTP: {"name": "Authorization", "value": "..."}.
                  # El valor debe ser una expresión ({{ $env.X }}), nunca un literal.
                  name, value = obj.get("name"), obj.get("value")
                  if (isinstance(name, str) and isinstance(value, str) and SECRET_KEY.search(name)
                          and value.strip() and "{{" not in value):
                      hits.append(f"{path}[{name}] = {value[:40]}")
                  for k, v in obj.items():
                      if k in IGNORED_KEYS:
                          continue
                      child = f"{path}.{k}"
                      if isinstance(v, str):
                          if SECRET_KEY.search(k) and v.strip():
                              hits.append(f"{child} = {v[:40]}")
                          elif SECRET_VALUE.search(v) and v.strip():
                              hits.append(f"{child} = {v[:40]}")
                      else:
                          walk(v, child, hits)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      walk(v, f"{path}[{i}]", hits)

          FILES = sorted(glob.glob("src/n8n-workflows/**/*.json", recursive=True))
          FAIL = 0
          for f in FILES:
              with open(f, encoding="utf-8") as fh:
                  data = json.load(fh)
              hits = []
              walk(data, f.split("/")[-1], hits)
              for h in hits:
                  print(f"  ⚠️  {h}")
                  FAIL = 1

          if FAIL:
              print("❌ Se detectaron posibles credenciales expuestas en los workflows")
              sys.exit(1)
          print("✅ Sin credenciales expuestas (solo se marcan valores sensibles reales)")
          PYEOF

      - name: Verificar traza a Arize Phoenix en workflows con LLM (ADR-010)
        if: steps.filter.outputs.n8n == 'true'
        run: |
          echo "Verificando trazabilidad de Phoenix en workflows que invocan un LLM..."
          python3 - <<'PYEOF'
          import json, re, sys, glob

          # Un workflow invoca un LLM si tiene un nodo nativo de modelo/embeddings (LangChain)
          # o un nodo HTTP contra un proveedor de IA (p. ej. Kimi/GLM en NVIDIA vía HTTP).
          LLM_NODE_TYPE = re.compile(r"(?i)\.(lmChat|lmOpenAi|embeddings)")
          LLM_URL = re.compile(
              r"(?i)(integrate\.api\.nvidia\.com|generativelanguage\.googleapis\.com|"
              r"api\.anthropic\.com|api\.openai\.com|openrouter\.ai)"
          )

          def es_http(n):
              return n.get("type", "").endswith(".httpRequest")

          def url(n):
              return str(n.get("parameters", {}).get("url", ""))

          FAIL = 0
          con_llm = 0
          for f in sorted(glob.glob("src/n8n-workflows/production/*.json")):
              with open(f, encoding="utf-8") as fh:
                  wf = json.load(fh)
              nodos = [n for n in wf.get("nodes", []) if not n.get("disabled")]
              llm = [n["name"] for n in nodos
                     if LLM_NODE_TYPE.search(n.get("type", "")) or (es_http(n) and LLM_URL.search(url(n)))]
              if not llm:
                  continue
              con_llm += 1

              # Nodos que reciben alguna conexión (un nodo Phoenix suelto no cuenta).
              destinos = set()
              for salidas in wf.get("connections", {}).values():
                  for ramas in salidas.values():
                      for rama in ramas or []:
                          for c in rama or []:
                              destinos.add(c.get("node"))
              phoenix = [n["name"] for n in nodos
                         if es_http(n) and "phoenix" in url(n).lower() and n["name"] in destinos]

              nombre = f.split("/")[-1]
              if phoenix:
                  print(f"OK: {nombre} invoca LLM ({', '.join(llm)}) y traza en: {', '.join(phoenix)}")
              else:
                  print(f"ERROR: {nombre} invoca LLM ({', '.join(llm)}) pero no tiene un nodo HTTP "
                        "conectado que envíe la traza a Arize Phoenix (ADR-010)")
                  FAIL = 1

          if con_llm == 0:
              print("No se encontraron workflows de produccion que invoquen un LLM.")
          sys.exit(FAIL)
          PYEOF

      - name: Sin cambios relevantes
        if: steps.filter.outputs.n8n == 'false'
        run: echo "✅ Este PR no toca n8n-workflows/ ni ia-ops/ — se omite la validación, check en verde"

  validate-live-connection:
    name: Validación contra instancia n8n (opcional - no bloqueante)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    steps:
      - name: Verificar si hay credenciales de n8n configuradas
        id: check_n8n
        run: |
          if [ -z "${{ secrets.AZURE_VM_HOST }}" ] || [ -z "${{ secrets.AZURE_VM_SSH_KEY }}" ] || [ -z "${{ secrets.AZURE_VM_USER }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Secrets AZURE_VM_HOST / AZURE_VM_SSH_KEY / AZURE_VM_USER no configurados — se omite la validación en vivo"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Verificar que n8n esté activo en la VM Azure
        if: steps.check_n8n.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker inspect --format '{{.State.Status}}' healthradar-n8n | grep -q running || (echo "❌ n8n no está corriendo" && exit 1)
            docker exec healthradar-n8n wget -qO- http://localhost:5678/healthz || (echo "❌ n8n no responde" && exit 1)
            echo "✅ n8n está activo y respondiendo"