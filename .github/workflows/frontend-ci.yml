name: Frontend CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mf_consulta:   ${{ steps.filter.outputs.mf_consulta }}
      mf_historicos: ${{ steps.filter.outputs.mf_historicos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mf_consulta:
              - 'src/mf-consulta/**'
            mf_historicos:
              - 'src/mf-historicos/**'

  build-mf-consulta:
    needs: changes
    if: needs.changes.outputs.mf_consulta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/mf-consulta/package-lock.json
      - name: Instalar dependencias
        working-directory: src/mf-consulta
        run: npm ci
      - name: Build
        working-directory: src/mf-consulta
        run: npm run build

  build-mf-historicos:
    needs: changes
    if: needs.changes.outputs.mf_historicos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/mf-historicos/package-lock.json
      - name: Instalar dependencias
        working-directory: src/mf-historicos
        run: npm ci
      - name: Build
        working-directory: src/mf-historicos
        run: npm run build