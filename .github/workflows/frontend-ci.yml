name: Frontend CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Verificar estructura del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios relevantes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'

      - name: Configurar Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        run: npm ci

      - name: Ejecutar lint
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        run: npm run lint

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        run: npm run build

      - name: Sin cambios relevantes
        if: steps.filter.outputs.frontend == 'false'
        run: echo "✅ Este PR no toca src/frontend/ — se omite el build, check en verde"
