name: AI Testing CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detectar cambios en QA
    runs-on: ubuntu-latest
    outputs:
      qa: ${{ steps.filter.outputs.qa }}
    steps:
      - uses: actions/checkout@v4
      - name: Filtrar rutas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            qa:
              - 'src/ia-ops/**'
              - 'requirements.txt'
              - '.github/workflows/ai-testing-ci.yml'

  sast:
    name: Análisis estático de código (SAST)
    needs: changes
    if: needs.changes.outputs.qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analizar con CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Ejecutar análisis
        uses: github/codeql-action/analyze@v3

  test:
    name: Ejecutar pruebas de prompts
    needs: [changes, sast]
    if: needs.changes.outputs.qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar si hay webhook de n8n configurado
        id: check_webhook
        run: |
          if [ -z "${{ secrets.N8N_NLQ_WEBHOOK_URL }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ N8N_NLQ_WEBHOOK_URL no configurado — se omiten estas pruebas"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: "QA · Seguridad — Prompt Injection (HU-04)"
        if: steps.check_webhook.outputs.skip == 'false'
        continue-on-error: true
        env:
          N8N_NLQ_WEBHOOK_URL: ${{ secrets.N8N_NLQ_WEBHOOK_URL }}
        run: python -m pytest src/ia-ops/tests/test_prompt_injection.py -v

      - name: "QA · Integración — Flujo NLQ (HU-06)"
        if: steps.check_webhook.outputs.skip == 'false'
        continue-on-error: true
        env:
          N8N_NLQ_WEBHOOK_URL: ${{ secrets.N8N_NLQ_WEBHOOK_URL }}
        run: python -m pytest src/ia-ops/tests/test_n8n_connection.py -v

      - name: "QA · Esquema — Outputs del LLM (HU-05)"
        if: steps.check_webhook.outputs.skip == 'false'
        continue-on-error: true
        env:
          N8N_NLQ_WEBHOOK_URL: ${{ secrets.N8N_NLQ_WEBHOOK_URL }}
        run: python -m pytest src/ia-ops/tests/test_llm_outputs.py -v
      
      - name: "QA · Detección de Periodo NLQ (HU-10)"
        if: steps.check_webhook.outputs.skip == 'false'
        continue-on-error: true
        env:
          N8N_NLQ_WEBHOOK_URL: ${{ secrets.N8N_NLQ_WEBHOOK_URL }}
        run: python -m pytest src/ia-ops/tests/test_nlq_periodo.py -v

      - name: "QA · Failover Multi-Modelo (HU-11)"
        if: steps.check_webhook.outputs.skip == 'false'
        continue-on-error: true
        env:
          N8N_NLQ_WEBHOOK_URL: ${{ secrets.N8N_NLQ_WEBHOOK_URL }}
        run: python -m pytest src/ia-ops/tests/test_failover_modelo.py -v