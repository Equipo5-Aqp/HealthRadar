name: n8n Deploy CD

# Se activa SOLO al publicar un tag de versión (v*.*.*) o manualmente.
# Requiere aprobación manual vía el Environment "production" (Settings → Environments).
# El CI de validación (n8n-validate-ci.yml) ya corrió en el PR hacia develop/main,
# y el gate de staging (staging-smoke-test.yml) ya corrió en el PR hacia develop.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  deploy-n8n:
    name: Desplegar y Publicar Workflows en n8n Producción
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── PASO 1 y 2: git pull + copiar + importar ──────────────────────────────
      - name: Actualizar repo, copiar e importar workflows en n8n
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e

            echo "===================================================="
            echo "🚀 INICIANDO DESPLIEGUE CONTINUO (CD) DE N8N"
            echo "===================================================="

            REPO_DIR="/home/azureuser/HealthRadar"
            WORKFLOWS_DIR="$REPO_DIR/src/n8n-workflows/production"
            CONTAINER_NAME="healthradar-n8n"

            echo "📥 1. Actualizando repositorio en la VM..."
            cd "$REPO_DIR"

            echo "  🧹 Sincronizando con origin/main (descartando cualquier residuo local)..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd src/n8n-workflows/production/

            echo "🔍 2. Verificando que el contenedor esté activo..."
            docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME" | grep -q running || {
              echo "❌ El contenedor $CONTAINER_NAME no está corriendo."
              exit 1
            }

            echo "📂 3. Copiando flujos JSON al contenedor..."
            docker exec "$CONTAINER_NAME" rm -rf /tmp/n8n-import
            docker exec "$CONTAINER_NAME" mkdir -p /tmp/n8n-import

            docker cp "$WORKFLOWS_DIR/." "$CONTAINER_NAME":/tmp/n8n-import/
            echo "  📄 Archivos copiados al contenedor:"
            docker exec "$CONTAINER_NAME" ls -1 /tmp/n8n-import/

            echo "📥 4. Importando flujos a la base de datos de n8n..."
            docker exec "$CONTAINER_NAME" n8n import:workflow --separate --input=/tmp/n8n-import/
            echo "  ✅ Flujos importados en la BD de n8n."

      # ── PASO 3: Publicar/Activar vía API de n8n ──────────────────────────────
      - name: Publicar y activar workflows vía API de n8n
        uses: appleboy/ssh-action@v1
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          envs: N8N_API_KEY
          script: |
            CONTAINER_NAME="healthradar-n8n"
            REPO_DIR="/home/azureuser/HealthRadar"
            WORKFLOWS_DIR="$REPO_DIR/src/n8n-workflows/production"

            if [ -z "$N8N_API_KEY" ]; then
              echo "⚠️  Secret N8N_API_KEY no configurado en GitHub."
              echo "   Los flujos fueron importados en la BD pero NO se publicaron."
              echo ""
              echo "   👉 Para completar la automatización:"
              echo "   1. Ir a la UI de n8n → Settings → n8n API → Create new API key"
              echo "   2. GitHub repo → Settings → Secrets → New → N8N_API_KEY"
              echo "   3. Volver a hacer push para que este paso se ejecute."
              exit 0
            fi

            echo "🔑 API Key detectada. Publicando flujos vía API de n8n..."

            N8N_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_NAME" 2>/dev/null || echo "")

            if [ -z "$N8N_IP" ]; then
              N8N_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "healthradar-net").IPAddress}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
            fi

            if [ -z "$N8N_IP" ]; then
              echo "⚠️  No se pudo resolver la IP por inspección, usando fallback 172.18.0.4..."
              N8N_IP="172.18.0.4"
            fi

            echo "  📡 IP interna de n8n en la red Docker: $N8N_IP:5678"

            for json_file in "$WORKFLOWS_DIR"/*.json; do
              [ -f "$json_file" ] || continue
              FNAME=$(basename "$json_file")

              WF_ID=$(python3 -c \
                "import sys, json; d=json.load(open(sys.argv[1], encoding='utf-8')); print(d.get('id',''))" \
                "$json_file" 2>/dev/null || echo "")
              WF_NAME=$(python3 -c \
                "import sys, json; d=json.load(open(sys.argv[1], encoding='utf-8')); print(d.get('name',''))" \
                "$json_file" 2>/dev/null || echo "$FNAME")
              [ -z "$WF_NAME" ] && WF_NAME="$FNAME"

              if [ -z "$WF_ID" ]; then
                echo "  ⚠️  $FNAME no tiene campo 'id' — verificar el JSON"
                continue
              fi

              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                "http://$N8N_IP:5678/api/v1/workflows/$WF_ID/activate")

              if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
                echo "  ✅ Publicado: $WF_NAME (ID: $WF_ID)"
              else
                echo "  ⚠️  No se pudo publicar $WF_NAME (ID: $WF_ID) — HTTP $HTTP_STATUS"
              fi
            done

            echo "✅ Todos los flujos procesados."

      # ── PASO 4: Limpiar temporales y verificación final ───────────────────────
      - name: Limpieza y verificación final
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            CONTAINER_NAME="healthradar-n8n"

            echo "🧹 Limpiando archivos temporales del contenedor..."
            docker exec "$CONTAINER_NAME" sh -c 'rm -rf /tmp/n8n-import/ 2>/dev/null || true'

            echo "🔍 Verificando healthcheck de n8n..."
            MAX_RETRIES=15
            COUNT=0
            READY=false

            while [ $COUNT -lt $MAX_RETRIES ]; do
              sleep 2
              CONTAINER_STATE=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "not_found")
              if [ "$CONTAINER_STATE" = "running" ]; then
                if docker exec "$CONTAINER_NAME" wget -qO- http://localhost:5678/healthz > /dev/null 2>&1; then
                  READY=true
                  break
                fi
              fi
              COUNT=$((COUNT + 1))
              echo "  ...esperando n8n - estado: $CONTAINER_STATE ($COUNT/$MAX_RETRIES)"
            done

            if [ "$READY" = true ]; then
              echo "===================================================="
              echo "✅ DESPLIEGUE EXITOSO: n8n activo y flujos desplegados."
              echo "===================================================="
            else
              echo "❌ n8n no respondió al healthcheck."
              docker logs --tail=40 "$CONTAINER_NAME"
              exit 1
            fi

      # ── PASO 5: Pruebas de humo (bloqueantes) ────────────────────────────────
      - name: Verificar que Phoenix responde internamente
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            CONTAINER_NAME="healthradar-phoenix"
            CONTAINER_STATE=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "not_found")
            if [ "$CONTAINER_STATE" != "running" ]; then
              echo "⚠️ Phoenix no está corriendo (estado: $CONTAINER_STATE) — se omite esta verificación"
              exit 0
            fi
            docker exec "$CONTAINER_NAME" wget -qO- http://localhost:6006 > /dev/null \
              && echo "✅ Phoenix responde" \
              || (echo "❌ Phoenix no responde" && exit 1)

      - name: Smoke test del flujo NLQ (webhook de n8n)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            RESPONSE=$(docker exec healthradar-n8n wget -qO- --header="Content-Type: application/json" \
              --post-data='{"pregunta":"prueba de humo staging"}' \
              http://localhost:5678/webhook/consulta || echo "FAIL")
            echo "$RESPONSE" | grep -q "FAIL" && (echo "❌ Webhook NLQ no respondió" && exit 1) || echo "✅ Webhook NLQ respondió"

      - name: Verificar logs por errores fatales
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker logs healthradar-n8n 2>&1 | grep -iE "fatal|unhandled" && (echo "❌ Errores fatales en n8n" && exit 1) || echo "✅ Sin errores fatales en n8n"