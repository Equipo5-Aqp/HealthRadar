# ==============================================================================
# Consolidar Reporte MLOps/DevSecOps
# Genera UN ÚNICO reporte consolidado por PR con el estado de TODOS los checks
# de CI/CD que ya corrieron en este Pull Request (lee resultados vía GitHub
# Checks API, NO re-ejecuta ningún pipeline existente).
#
# Gobernanza & Seguridad:
#   - permissions mínimos explícitos: checks: read, pull-requests: write, actions: read, contents: read
#   - concurrency por PR para evitar duplicidad de comentarios
#   - Acciones de GitHub pineadas por commit SHA inmutable
#   - Lógica de espera y reintentos (polling) para checks.listForRef
#   - Marcado de checks omitidos/skipped sin secrets como Omitido (no fallido)
#   - Atributo synthetic="true" en XML generado para transparencia con Arquitectura
#
# Autor: HerbertChCa (MLOps/DevSecOps)
# ==============================================================================

name: Consolidar Reporte MLOps

on:
  pull_request:
    branches: [main, develop]

permissions:
  checks: read
  pull-requests: write
  actions: read
  contents: read

concurrency:
  group: qa-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consolidar-reporte:
    name: Generar reporte consolidado de CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Esperar y recopilar estado de checks del PR vía GitHub API (Sleep + Retry)
        id: collect
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sha = context.payload.pull_request.head.sha;
            console.log(`Iniciando recopilación de checks para commit SHA: ${sha}`);

            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const maxAttempts = 10;
            const pollIntervalMs = 30000; // 30 segundos entre reintentos
            let allChecks = [];

            // Espera inicial de 20s para dar tiempo al scheduler de GitHub de registrar check-runs
            console.log("⏳ Pausa inicial de 20s para que los demás workflows se registren...");
            await wait(20000);

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`🔍 [Intento ${attempt}/${maxAttempts}] Consultando checks.listForRef...`);
              let fetched = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                  page: page
                });
                fetched = fetched.concat(data.check_runs);
                if (data.check_runs.length < 100) break;
                page++;
              }

              // Filtrar el propio job consolidador
              const otherChecks = fetched.filter(c => c.name !== 'Generar reporte consolidado de CI/CD');
              const inProgress = otherChecks.filter(c => c.status !== 'completed');

              console.log(`   Total checks: ${otherChecks.length} (En progreso: ${inProgress.length})`);

              // Si hay checks y todos finalizaron, salir antes
              if (otherChecks.length > 0 && inProgress.length === 0) {
                console.log("✅ Todos los checks del PR han completado su ejecución.");
                allChecks = otherChecks;
                break;
              }

              if (attempt === maxAttempts) {
                console.log("⚠️ Se alcanzó el número máximo de reintentos. Consolidando estado actual de los checks.");
                allChecks = otherChecks;
                break;
              }

              const pendingNames = inProgress.map(c => c.name).join(', ') || 'sin checks registrados aún';
              console.log(`⏳ Esperando 30s a que finalicen: [${pendingNames}]...`);
              await wait(pollIntervalMs);
            }

            console.log(`Total check runs a consolidar: ${allChecks.length}`);

            // Generar XML sintético con indicación explícita synthetic="true"
            let xmlSuites = '';
            let totalTests = 0;
            let totalFailures = 0;
            let totalSkipped = 0;
            let totalTime = 0.0;

            for (const check of allChecks) {
              totalTests++;
              let tcXml = '';
              const safeName = check.name.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              const safeOutput = (check.output && check.output.summary)
                ? check.output.summary.substring(0, 500).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                : '';
              const durationSec = (check.completed_at && check.started_at)
                ? Math.max(0, (new Date(check.completed_at) - new Date(check.started_at)) / 1000)
                : 0.0;
              const duration = durationSec.toFixed(1);
              totalTime += durationSec;

              if (check.conclusion === 'success' || check.conclusion === 'neutral') {
                tcXml = `    <testcase classname="github.check-run" name="${safeName}" time="${duration}" synthetic="true" />\n`;
              } else if (check.conclusion === 'skipped' || check.conclusion === null) {
                // Si el PR proviene de un fork o no hay secrets, los workflows quedan skipped.
                // Se marca estrictamente como OMITIDO (no fallido)
                totalSkipped++;
                const msg = (check.conclusion === null && check.status !== 'completed')
                  ? 'Check en ejecución al momento de la consolidación'
                  : 'Check omitido (filtro de rutas o entorno sin secrets)';
                tcXml = `    <testcase classname="github.check-run" name="${safeName}" time="${duration}" synthetic="true"><skipped message="${msg}"/></testcase>\n`;
              } else {
                // failure, cancelled, action_required, timed_out, stale
                totalFailures++;
                const failMsg = check.conclusion ? check.conclusion.replace(/"/g, '&quot;') : 'fallido';
                tcXml = `    <testcase classname="github.check-run" name="${safeName}" time="${duration}" synthetic="true"><failure message="Conclusión: ${failMsg}">${safeOutput}</failure></testcase>\n`;
              }
              xmlSuites += tcXml;
            }

            const totalPassed = totalTests - totalFailures - totalSkipped;
            const xml = `<?xml version="1.0" encoding="utf-8"?>\n<testsuites synthetic="true">\n  <testsuite name="GitHub Check Runs (Consolidado MLOps)" synthetic="true" tests="${totalTests}" failures="${totalFailures}" skipped="${totalSkipped}" errors="0" time="${totalTime.toFixed(1)}">\n${xmlSuites}  </testsuite>\n</testsuites>`;

            fs.mkdirSync('resultados-xml', { recursive: true });
            fs.writeFileSync('resultados-xml/resultados-checks-cicd.xml', xml, 'utf8');
            console.log(`✅ XML sintético generado: ${totalTests} checks (${totalPassed} OK, ${totalFailures} fallidos, ${totalSkipped} omitidos)`);

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Instalar wkhtmltopdf (conversión PDF, no bloqueante)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf 2>/dev/null || echo "⚠️ wkhtmltopdf no disponible en el sistema"

      - name: Generar Reporte Consolidado (HTML, PDF, Markdown)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/consolidar_reporte.py \
            --xml-dir resultados-xml \
            --output-html reporte-mlops-pr-${PR_NUMBER}.html \
            --output-pdf reporte-mlops-pr-${PR_NUMBER}.pdf \
            --output-summary-md resumen-pr.md \
            --pr-number "${PR_NUMBER}" \
            --pr-title "${PR_TITLE}" \
            --commit-sha "${COMMIT_SHA}" \
            --run-url "${RUN_URL}"

      - name: Subir reporte consolidado (PDF / HTML)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: reporte-mlops-pr-${{ github.event.pull_request.number || 'local' }}
          path: |
            reporte-mlops-pr-*.pdf
            reporte-mlops-pr-*.html
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar comentario automático en el Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('resumen-pr.md')) {
              console.log('No se encontró resumen-pr.md; se omite comentario.');
              return;
            }
            const body = fs.readFileSync('resumen-pr.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '<!-- healthradar-qa-report -->';
            const botComment = comments.find(c => c.body && c.body.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log(`Comentario actualizado sin duplicar en PR #${context.issue.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log(`Nuevo comentario publicado en PR #${context.issue.number}`);
            }

