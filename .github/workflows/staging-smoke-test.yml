name: Staging Smoke Test

on:
  pull_request:
    branches: [develop]

jobs:
  smoke-test:
    name: Levantar stack completo y validar (efímero)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env de prueba
        run: cp infrastructure/.env.staging.example infrastructure/.env

      - name: Levantar el stack completo
        working-directory: infrastructure
        run: docker compose --env-file .env up -d

      - name: Esperar a que Postgres esté healthy
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' healthradar-postgres 2>/dev/null || echo "starting")
            [ "$STATUS" = "healthy" ] && echo "✅ Postgres healthy" && break
            echo "...esperando Postgres ($i/20)"; sleep 3
          done

      - name: Esperar a que n8n responda
        run: |
          for i in $(seq 1 20); do
            docker exec healthradar-n8n wget -qO- http://localhost:5678/healthz && echo "✅ n8n healthy" && break
            echo "...esperando n8n ($i/20)"; sleep 3
          done