name: Staging Smoke Test

on:
  pull_request:
    branches: [develop]

jobs:
  smoke-test:
    name: Levantar stack completo y validar (efímero)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios en tests de QA
        uses: dorny/paths-filter@v3
        id: qa_filter
        with:
          filters: |
            qa:
              - 'src/ia-ops/tests/test_ingesta_boletin.py'

      - name: Preparar .env de prueba
        run: cp infrastructure/.env.staging.example infrastructure/.env

      - name: Levantar el stack completo
        working-directory: infrastructure
        run: docker compose --env-file .env up -d

      - name: Esperar a que Postgres esté healthy
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' healthradar-postgres 2>/dev/null || echo "starting")
            [ "$STATUS" = "healthy" ] && echo "✅ Postgres healthy" && break
            echo "...esperando Postgres ($i/20)"; sleep 3
          done

      - name: Configurar Python para tests de QA
        if: steps.qa_filter.outputs.qa == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de QA
        if: steps.qa_filter.outputs.qa == 'true'
        run: pip install psycopg2-binary pytest

      - name: "QA · Ingesta de Boletines (HU-08)"
        if: steps.qa_filter.outputs.qa == 'true'
        continue-on-error: true
        env:
          HEALTHRADAR_DB_HOST: localhost
          HEALTHRADAR_DB_PORT: 5432
          HEALTHRADAR_DB_NAME: healthradar_db
          HEALTHRADAR_DB_USER: healthradar_admin
          HEALTHRADAR_DB_PASSWORD: healthradar_admin
        run: python -m pytest src/ia-ops/tests/test_ingesta_boletin.py -v

      - name: Esperar a que n8n responda
        run: |
          for i in $(seq 1 20); do
            docker exec healthradar-n8n wget -qO- http://localhost:5678/healthz && echo "✅ n8n healthy" && break
            echo "...esperando n8n ($i/20)"; sleep 3
          done

      - name: Smoke test del flujo NLQ (webhook de n8n)
        run: |
          RESPONSE=$(docker exec healthradar-n8n wget -qO- --header="Content-Type: application/json" \
            --post-data='{"pregunta":"prueba de humo staging"}' \
            http://localhost:5678/webhook/consulta || echo "FAIL")
          echo "$RESPONSE" | grep -q "FAIL" && (echo "❌ Webhook NLQ no respondió" && exit 1) || echo "✅ Webhook NLQ respondió"

      - name: Verificar logs por errores fatales
        run: |
          docker logs healthradar-n8n 2>&1 | grep -iE "fatal|unhandled" && (echo "❌ Errores fatales en n8n" && exit 1) || echo "✅ Sin errores fatales en n8n"

      - name: Apagar y limpiar el stack (siempre se ejecuta)
        if: always()
        working-directory: infrastructure
        run: docker compose down -v